<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeo · El caso Yuri Lipski y el Blue Hole de Dahab</title>
<style>
  :root { --bg:#0a1020; --panel:#111a2e; --line:#24314d; --tx:#e9eefb; --mu:#8a9aba; --teal:#2dd4bf; --pink:#ec4899; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--tx); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
  main { max-width:1100px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:clamp(24px, 4vw, 38px); }
  h1 span { color:var(--teal); }
  p.sub { color:var(--mu); margin:6px 0 22px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { background:var(--panel); color:var(--tx); border:2px solid var(--line); border-radius:10px; padding:8px 18px; font:600 15px inherit; cursor:pointer; }
  .tabs button[aria-pressed="true"] { border-color:var(--teal); color:var(--teal); }
  video { width:100%; border-radius:14px; background:#000; border:2px solid var(--line); display:block; }
  .links { margin-top:18px; display:flex; flex-wrap:wrap; gap:10px 22px; font-size:15px; }
  a { color:var(--teal); }
  .note { margin-top:26px; color:var(--mu); font-size:14px; border-left:4px solid var(--pink); padding-left:12px; }
</style>
</head>
<body>
<main>
  <h1>El caso Yuri Lipski y el <span>Blue Hole de Dahab</span></h1>
  <p class="sub" id="sub">Vídeo resumen del estudio divulgativo · Óscar Ramírez Martín</p>
  <div class="tabs">
    <button id="b-es" aria-pressed="true">Castellano</button>
    <button id="b-en" aria-pressed="false">English</button>
  </div>
  <video id="v" controls preload="metadata" poster="miniatura_es.jpg">
    <source src="Video_Yuri_Lipski_Blue_Hole_Dahab_ES.mp4" type="video/mp4">
  </video>
  <div class="links">
    <a href="https://github.com/Oskillar28/blue-hole-dahab-yuri-lipski">← Repositorio en GitHub</a>
    <a id="dl" href="Video_Yuri_Lipski_Blue_Hole_Dahab_ES.mp4" download>Descargar el vídeo (MP4)</a>
  </div>
  <p class="note" id="note">Este vídeo trata la muerte real de una persona. No muestra la grabación de su muerte ni imágenes de la víctima.</p>
</main>
<script>
  const L = {
    es: { src:"Video_Yuri_Lipski_Blue_Hole_Dahab_ES.mp4", poster:"miniatura_es.jpg", sub:"Vídeo resumen del estudio divulgativo · Óscar Ramírez Martín", dl:"Descargar el vídeo (MP4)", note:"Este vídeo trata la muerte real de una persona. No muestra la grabación de su muerte ni imágenes de la víctima.", lang:"es" },
    en: { src:"Video_Yuri_Lipski_Dahab_Blue_Hole_EN.mp4", poster:"miniatura_en.jpg", sub:"Video summary of the popular science study · Óscar Ramírez Martín", dl:"Download the video (MP4)", note:"This video deals with the real death of a person. It does not show the footage of his death or any images of the victim.", lang:"en" }
  };
  const v = document.getElementById("v");
  function set(k) {
    const x = L[k];
    v.pause(); v.poster = x.poster; v.querySelector("source").src = x.src; v.load();
    document.getElementById("sub").textContent = x.sub;
    document.getElementById("note").textContent = x.note;
    const dl = document.getElementById("dl"); dl.href = x.src; dl.textContent = x.dl;
    document.documentElement.lang = x.lang;
    document.getElementById("b-es").setAttribute("aria-pressed", k === "es");
    document.getElementById("b-en").setAttribute("aria-pressed", k === "en");
  }
  document.getElementById("b-es").onclick = () => set("es");
  document.getElementById("b-en").onclick = () => set("en");
  if (location.hash === "#en") set("en");
</script>
</body>
</html>
